name: Publish

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Version + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm Trusted Publishing (OIDC): GitHub issues a short-lived id-token per run and npm exchanges it for
      # publish credentials. No NPM_TOKEN secret. Each package needs a Trusted Publisher on npmjs.com pointing at
      # this repository and this workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # OIDC in `pnpm publish` needs pnpm >= 10.12 (pinned in packageManager).
      - uses: pnpm/action-setup@v4

      # Node 24's npm client fails changesets publishes with "Premature close"; stay on 22 LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # The OIDC exchange needs npm CLI >= 11.5.1; the runner ships npm 10.x, which fails with a misleading E404.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
