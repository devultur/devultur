name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Checks every pull request author against the signatures, and records a signature when someone comments the
      # sign-off phrase. Signatures live in the `cla-signatures` branch of this repository: no external service.
      # `claude` is the AI co-author on the maintainer's commits (Co-Authored-By trailer), not a separate contributor.
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/devultur/devultur/blob/main/CLA.md
          branch: cla-signatures
          allowlist: demarchenac,claude,dependabot[bot],github-actions[bot],changeset-bot[bot]
